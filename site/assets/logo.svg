<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Melinna">
  <title>Melinna</title>
  <desc>Um feixe único atravessa um prisma e sai decomposto em seis faixas: uma tarefa, vários agentes em paralelo.</desc>

  <defs>
    <radialGradient id="vignette" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1b2029"/>
      <stop offset="70%" stop-color="#12151b"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </radialGradient>

    <linearGradient id="beamIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6e9ef" stop-opacity="0"/>
      <stop offset="35%" stop-color="#e6e9ef" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="prismFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b95a5" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#4f8cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e6e9ef" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="disc">
      <circle cx="256" cy="256" r="236"/>
    </clipPath>
  </defs>

  <!-- campo: quadrado com cantos chanfrados -->
  <path d="M 36 0 H 476 L 512 36 V 476 L 476 512 H 36 L 0 476 V 36 Z" fill="#07080b"/>

  <!-- disco -->
  <circle cx="256" cy="256" r="236" fill="url(#vignette)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#262c36" stroke-width="2"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#1b212b" stroke-width="1"/>

  <g clip-path="url(#disc)">
    <!-- faixas dispersas: seis agentes a partir da mesma tarefa -->
    <g filter="url(#softGlow)" stroke-linecap="round" opacity="0.95">
      <line x1="282.5" y1="246" x2="456.6" y2="264.3" stroke="#ff3b30" stroke-width="8"/>
      <line x1="282.5" y1="246" x2="454.3" y2="279.4" stroke="#ff9f0a" stroke-width="8"/>
      <line x1="282.5" y1="246" x2="450.7" y2="294.2" stroke="#ffd60a" stroke-width="8"/>
      <line x1="282.5" y1="246" x2="445.9" y2="308.7" stroke="#34c759" stroke-width="8"/>
      <line x1="282.5" y1="246" x2="439.8" y2="322.7" stroke="#0a84ff" stroke-width="8"/>
      <line x1="282.5" y1="246" x2="432.5" y2="336.1" stroke="#bf5af2" stroke-width="8"/>
    </g>

    <!-- feixe de entrada: a tarefa -->
    <line x1="52" y1="246" x2="219" y2="246" stroke="url(#beamIn)" stroke-width="9"
          stroke-linecap="round" filter="url(#tightGlow)"/>

    <!-- prisma -->
    <path d="M 250 184 L 318 302.5 L 182 302.5 Z" fill="url(#prismFace)"
          stroke="#e6e9ef" stroke-width="3" stroke-linejoin="round" opacity="0.92"/>
    <path d="M 250 184 L 318 302.5" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>

    <!-- ponto de incidência -->
    <circle cx="219" cy="246" r="4.5" fill="#ffffff" filter="url(#tightGlow)"/>

    <!-- detalhes de instrumentação -->
    <g stroke="#2d3542" fill="none" stroke-width="2" opacity="0.75">
      <path d="M 92 150 A 180 180 0 0 0 92 362"/>
      <path d="M 420 150 A 180 180 0 0 1 420 362" opacity="0.45"/>
    </g>
    <g fill="#39455a" opacity="0.9">
      <rect x="96" y="250" width="16" height="3" rx="1.5"/>
      <rect x="96" y="262" width="9" height="3" rx="1.5"/>
      <rect x="400" y="190" width="16" height="3" rx="1.5"/>
      <rect x="407" y="202" width="9" height="3" rx="1.5"/>
    </g>
  </g>

  <!-- moldura técnica -->
  <g stroke="#39455a" fill="none" stroke-width="3" opacity="0.8">
    <path d="M 26 92 V 40 L 78 40"/>
    <path d="M 486 92 V 40 L 434 40"/>
    <path d="M 26 420 V 472 L 78 472"/>
    <path d="M 486 420 V 472 L 434 472"/>
  </g>
</svg>
