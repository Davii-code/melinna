appId: io.github.davii-code.melinna
productName: Melinna
executableName: melinna-desk
copyright: Copyright © 2026 Davii-code
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - catalog/**
  - package.json
# O hospedeiro roda fora do asar e importa os pedaços que divide com o principal (out/chunks): sem eles
# desempacotados, ele morre ao iniciar ("hospedeiro de terminais não respondeu em 5 segundos").
asarUnpack:
  - node_modules/node-pty/**
  - out/host/**
  - out/chunks/**
extraResources:
  - from: catalog
    to: catalog
# node-pty 1.1 é N-API e traz binários pré-compilados para Windows e macOS: não recompilar no empacotamento.
npmRebuild: false
electronFuses:
  runAsNode: true
icon: build/icons/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icons/icon.png
  # Assinatura de código (code signing). Preencher quando a TI/segurança emitir o certificado
  # da organização. Enquanto estiver comentado, o build sai sem assinatura (comportamento atual).
  # Nomes de campo do electron-builder 26 (bloco signtoolOptions).
  # Timestamp é obrigatório: mantém a assinatura válida depois que o certificado expira.
  #
  # Opção A — certificado OV em arquivo .pfx (menos comum em ambiente corporativo):
  # signtoolOptions:
  #   certificateFile: ${env.MELINNA_CERT_FILE}       # caminho do .pfx
  #   certificatePassword: ${env.MELINNA_CERT_PASSWORD}
  #   signingHashAlgorithms: [sha256]
  #   rfc3161TimeStampServer: http://timestamp.digicert.com
  #
  # Opção B — certificado EV em token/HSM (recomendado; chave não exportável).
  # Identifica o certificado já instalado no repositório de certificados do Windows:
  # signtoolOptions:
  #   certificateSubjectName: "<nome do titular exatamente como aparece no certificado>"
  #   signingHashAlgorithms: [sha256]
  #   rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Melinna
  uninstallDisplayName: Melinna
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: melinna.${ext}
  installerLanguages: [pt_BR]
  language: '1046'
mac:
  target: dmg
  icon: build/icons/icon.png
linux:
  target: AppImage
  icon: build/icons/icon.png
  category: Development
  artifactName: melinna.${ext}
